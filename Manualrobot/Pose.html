<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ESP32 Pose Robot Control</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background-color: #f4f4f9; margin-top: 30px; }
        button { padding: 12px 24px; font-size: 18px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #45a049; }
        #canvas { margin-top: 20px; border-radius: 10px; box-shadow: 0px 4px 8px rgba(0,0,0,0.2); }
        #label-container div { font-size: 22px; font-weight: bold; margin: 8px; color: #333; }
    </style>
</head>
<body>
    <h1>Robot Gesture Control via Teachable Machine</h1>
    <button type="button" onclick="init()">Start Camera</button>
    
    <div><canvas id="canvas"></canvas></div>
    <div id="label-container"></div>

    <!-- โหลดไลบรารี TensorFlow.js และ Teachable Machine Pose -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/pose@0.8/dist/teachablemachine-pose.min.js"></script>
    
    <script type="text/javascript">
        // 1. นำ Shareable Link จาก Teachable Machine มาใส่ตรงนี้ (อย่าลืมเครื่องหมาย / ปิดท้าย)
        const URL = "https://teachablemachine.withgoogle.com/models/6Oju25YXv/";

        // 2. ใส่ IP Address ที่ขึ้นใน Serial Monitor ของ ESP32 ตอนต่อ Wi-Fi สำเร็จ
        const esp32_ip = "192.168.1.50"; 

        let model, webcam, ctx, labelContainer, maxPredictions;
        let lastCommand = "";
        let lastCommandTime = 0;

        async function init() {
            const modelURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";

            model = await tmPose.load(modelURL, metadataURL);
            maxPredictions = model.getTotalClasses();

            const size = 300;
            const flip = true;
            webcam = new tmPose.Webcam(size, size, flip);
            await webcam.setup();
            await webcam.play();
            window.requestAnimationFrame(loop);

            const canvas = document.getElementById("canvas");
            canvas.width = size; canvas.height = size;
            ctx = canvas.getContext("2d");
            
            labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";
            for (let i = 0; i < maxPredictions; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }
        }

        async function loop(timestamp) {
            webcam.update();
            await predict();
            window.requestAnimationFrame(loop);
        }

        async function predict() {
            const { pose, posenetOutput } = await model.estimatePose(webcam.canvas);
            const prediction = await model.predict(posenetOutput);

            for (let i = 0; i < maxPredictions; i++) {
                const classPrediction = prediction[i].className + ": " + (prediction[i].probability * 100).toFixed(1) + "%";
                labelContainer.childNodes[i].innerHTML = classPrediction;

                // ตรวจสอบความมั่นใจมากกว่า 85%
                if (prediction[i].probability > 0.85) {
                    let currentClass = prediction[i].className;
                    
                    // ป้องกันไม่ให้ส่งคำสั่งรัวเกินไปในเสี้ยววินาทีเดียวกัน (หน่วง 0.8 วินาที)
                    if (currentClass !== lastCommand || (Date.now() - lastCommandTime > 800)) {
                        
                        // แมปชื่อ Class (S, F, B, L, R, on, off) ให้ส่งคำสั่งไป ESP32
                        if (currentClass === "F") {
                            sendToESP32("F"); // เดินหน้า
                        } else if (currentClass === "B") {
                            sendToESP32("B"); // ถอยหลัง
                        } else if (currentClass === "L") {
                            sendToESP32("L"); // เลี้ยวซ้าย
                        } else if (currentClass === "R") {
                            sendToESP32("R"); // เลี้ยวขวา
                        } else if (currentClass === "S") {
                            sendToESP32("S"); // หยุด
                        } else if (currentClass === "on") {
                            sendToESP32("O"); // เปิดตัวหนีบ
                        } else if (currentClass === "off") {
                            sendToESP32("C"); // ปิดตัวหนีบ
                        }

                        lastCommand = currentClass;
                        lastCommandTime = Date.now();
                    }
                }
            }

            drawPose(pose);
        }

        // ฟังก์ชันส่ง HTTP Request ไปยัง ESP32
        function sendToESP32(cmd) {
            console.log("Sending Command: " + cmd);
            fetch(`http://${esp32_ip}/move?cmd=${cmd}`)
                .then(response => response.text())
                .then(data => console.log("ESP32 Response:", data))
                .catch(error => console.error("Connection Error:", error));
        }

        function drawPose(pose) {
            if (webcam.canvas) {
                ctx.drawImage(webcam.canvas, 0, 0);
                if (pose) {
                    const minPartConfidence = 0.5;
                    tmPose.drawKeypoints(pose.keypoints, minPartConfidence, ctx);
                    tmPose.drawSkeleton(pose.keypoints, minPartConfidence, ctx);
                }
            }
        }
    </script>
</body>
</html>
